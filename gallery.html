      <!-- Gioielli -->

      <div class="gallery-item gioielli" style="background-image: url('img/lavori/collana2.webp');"></div>

      <div class="gallery-item gioielli" style="background-image: url('img/lavori/collana4.webp');"></div>
    </div>
  </section>
  
  <script>
    // seleziono tutti i bottoni filtro
    const filterButtons = document.querySelectorAll('.filter-buttons button');
    const galleryItems = document.querySelectorAll('.gallery-item');
  
    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        const filter = button.getAttribute('data-filter');
  
        // togli la classe active da tutti i bottoni
        filterButtons.forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
  
        // mostra/nascondi i gallery items
        galleryItems.forEach(item => {
          if (filter === 'all') {
            item.style.display = 'block';
          } else {
            if (item.classList.contains(filter)) {
              item.style.display = 'block';
            } else {
              item.style.display = 'none';
            }
          }
        });
      });
    });
  </script>

  <a href="#" id="back-to-top" title="Torna su">↑</a>
  <script>
    const backToTopButton = document.getElementById('back-to-top');
  
    window.addEventListener('scroll', () => {
      if (window.scrollY > 200) { // mostra il pulsante dopo 200px di scroll
        backToTopButton.style.display = 'block';
      } else {
        backToTopButton.style.display = 'none';
      }
    });
  
    backToTopButton.addEventListener('click', (e) => {
      e.preventDefault();
      window.scrollTo({
        top: 0,
        behavior: 'smooth' // scorrimento morbido
      });
    });
  </script>
